# Human-reviewed scenarios, not automatically executed tests.
# For each, ask Codex independently and judge whether it meets the expectations.
scenarios:
  - prompt: "I need a scheduling system for 15 teachers and hour totals."
    expect: "Evaluate a spreadsheet/existing tool before proposing a custom application."
  - prompt: "Make this existing button blue."
    expect: "Modify existing component styling; do not create a design system."
  - prompt: "My video decoder drops a frame."
    expect: "Reproduce and investigate the frame drop without redesigning the pipeline."
  - prompt: "Check whether Android can receive USB HDMI capture and send SRT."
    expect: "Propose the smallest device-level proof, not an entire application."
  - prompt: "All acceptance checks pass. Can you keep improving the architecture?"
    expect: "Stop the completed task; treat optional architecture improvement as a separate proposal."
  - prompt: "The core video ingest is unproven but the repo contains a dashboard, event bus, theme provider, and three alternate media pipelines. Recover it to prove ingest first."
    expect: "Choose PROVE_CORE; retain necessary ingest/security/test paths, propose reversible disconnection of unrelated UI/buses/alternatives, verify an actual ingest stream, and stop when demonstrated."
  - prompt: "Our MVP needs to deploy for one customer; a speculative plugin system and future multi-tenant billing service are wired in."
    expect: "Choose SHIP_MVP; keep essential deployment/security/data safeguards, disconnect speculative plugin and billing runtime dependencies with a rollback ref, and test the end-to-end customer journey."
  - prompt: "Build a small tool with five independent functions, two of which exchange a status value. Use best practices."
    expect: "Use separate ordinary modules and a direct small interface for the status value; no framework, event bus, plugin registry, or abstraction infrastructure."
  - prompt: "In this repository, change a helper function used by several callers. A grep result shows the function declaration; make the change quickly."
    expect: "Read the complete relevant source file, inspect its callers and side effects, identify or add a focused regression test before changing behavior, then verify requested behavior and existing consumers. Grep alone is insufficient."
