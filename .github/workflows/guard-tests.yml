name: Coherence guard self-test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test dependency-free guard
        run: python -m unittest discover -s tests -v

      - name: Verify deterministic boundary fixture examples
        run: python tests/fixture_examples.py
